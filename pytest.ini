[pytest]
# Aponta a descoberta pra pasta de testes e mostra cada teste (-v).
# Opcional: o arquivo test_golden_scenarios.py já é descoberto por padrão
# (nome test_*.py) e tem bootstrap de path próprio. Este arquivo só deixa
# `pytest` (sem argumentos, a partir do repo root) já mirar em tests/.
testpaths = tests
addopts = -v
